<svg width="1200" height="450" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ycBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="100%" stop-color="#0f0d0c"/>
    </radialGradient>
    <radialGradient id="ycGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <filter id="ycSoftBlur">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="ycShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#ycBg)"/>

  <!-- Orange ambient glow -->
  <ellipse cx="600" cy="215" rx="320" ry="220" fill="url(#ycGlow)" filter="url(#ycSoftBlur)"/>

  <!--
    Logo unit: square (180 × 180) + 32px gap + "Startup School" text
    Center horizontally on 1200px canvas.
  -->
  <g transform="translate(300, 135)" filter="url(#ycShadow)">

    <!-- YC orange square -->
    <rect x="0" y="0" width="180" height="180" rx="6" fill="#ff6600"/>

    <!-- White "Y" mark, geometric YC style -->
    <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="square">
      <line x1="52" y1="52" x2="90" y2="108"/>
      <line x1="128" y1="52" x2="90" y2="108"/>
      <line x1="90" y1="108" x2="90" y2="146"/>
    </g>

    <!-- Wordmark -->
    <text x="212" y="112"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="58"
          font-weight="600"
          fill="#f5f5f5"
          letter-spacing="-1">
      Startup School
    </text>
    <text x="214" y="152"
          font-family="'Courier New', monospace"
          font-size="20"
          fill="#8a8a8a"
          letter-spacing="4">
      Y COMBINATOR · 2026
    </text>
  </g>
</svg>
